      REST API, middleware, business logic, and integrations
    </text>

    <rect x="770" y="250" width="370" height="100" rx="18" fill="#eefaf8" stroke="#c9e9e3" />
    <text x="792" y="278" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0a544e">Security middleware</text>
    <text x="792" y="306" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#3f6662">- helmet, cors, morgan</text>
    <text x="792" y="328" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#3f6662">- rate limiting and mongo sanitize</text>

    <rect x="770" y="368" width="370" height="120" rx="18" fill="#eefaf8" stroke="#c9e9e3" />
    <text x="792" y="396" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0a544e">Core route groups</text>
    <text x="792" y="424" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#3f6662">- /api/auth for registration, OTP, profile, reset</text>
    <text x="792" y="446" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#3f6662">- /api/doubts for posting, claiming, submit, rate, reopen</text>
    <text x="792" y="468" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#3f6662">- /api/members for team-member CRUD subset</text>

    <rect x="770" y="506" width="370" height="110" rx="18" fill="#eefaf8" stroke="#c9e9e3" />
    <text x="792" y="534" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0a544e">Platform management</text>
    <text x="792" y="562" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#3f6662">- /api/admin for stats, tutor approval, user control</text>
    <text x="792" y="584" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#3f6662">- /api/analytics for trends and turnaround metrics</text>
    <text x="792" y="606" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#3f6662">- /api/subjects and /api/health public endpoints</text>

    <rect x="770" y="634" width="370" height="126" rx="18" fill="#eefaf8" stroke="#c9e9e3" />
    <text x="792" y="662" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0a544e">Transaction and support services</text>
    <text x="792" y="690" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#3f6662">- Razorpay order creation, verification, cancellation, refund</text>
    <text x="792" y="712" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#3f6662">- Nodemailer based email OTP and password reset links</text>
    <text x="792" y="734" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#3f6662">- Multer image upload and static /uploads serving</text>
  </g>

