<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbfc" />
      <stop offset="100%" stop-color="#eef5f5" />
    </linearGradient>
    <linearGradient id="frontendHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
    <linearGradient id="backendHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b5d56" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="databaseHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#075985" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="serviceHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#35565c" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#b9c9cb" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)" />

  <text x="800" y="60" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#102a30">
    Smart Academic Query and Doubt Resolution Platform
  </text>
  <text x="800" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#436269">
    High-level MERN architecture with role-based workflows, subscription handling, and team-member management
  </text>

  <g filter="url(#shadow)">
    <rect x="70" y="180" width="120" height="120" rx="24" fill="#ffffff" stroke="#b9d5d8" stroke-width="2" />
    <circle cx="130" cy="225" r="24" fill="#86f2e4" />
    <text x="130" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#005049">S</text>
    <text x="130" y="268" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#14343b">Student</text>
    <text x="130" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#56737a">Posts, tracks, rates</text>

    <rect x="70" y="360" width="120" height="120" rx="24" fill="#ffffff" stroke="#b9d5d8" stroke-width="2" />
    <circle cx="130" cy="405" r="24" fill="#c4b5fd" />
    <text x="130" y="412" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#4c1d95">T</text>
    <text x="130" y="448" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#14343b">Tutor</text>
    <text x="130" y="472" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#56737a">Claims and solves</text>

    <rect x="70" y="540" width="120" height="120" rx="24" fill="#ffffff" stroke="#b9d5d8" stroke-width="2" />
    <circle cx="130" cy="585" r="24" fill="#bfdbfe" />
    <text x="130" y="592" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1d4ed8">A</text>
    <text x="130" y="628" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#14343b">Admin</text>
    <text x="130" y="652" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#56737a">Moderates platform</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="250" y="150" width="430" height="640" rx="28" fill="#ffffff" stroke="#c3d4d7" stroke-width="2" />
    <rect x="250" y="150" width="430" height="72" rx="28" fill="url(#frontendHeader)" />
    <rect x="250" y="194" width="430" height="28" fill="url(#frontendHeader)" />
    <text x="465" y="194" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#ffffff">
      React Frontend (Vite)
    </text>
    <text x="465" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#dce7ea">
      Browser clients / Vercel-ready SPA
    </text>

    <rect x="280" y="250" width="370" height="92" rx="18" fill="#f6fafb" stroke="#d8e6e8" />
    <text x="302" y="278" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#13363c">Public pages</text>
    <text x="302" y="306" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#46636a">- Landing page</text>
    <text x="302" y="328" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#46636a">- Login, registration, OTP, password reset</text>

    <rect x="280" y="360" width="370" height="110" rx="18" fill="#f6fafb" stroke="#d8e6e8" />
    <text x="302" y="388" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#13363c">Student workspace</text>
    <text x="302" y="416" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#46636a">- Student dashboard and filters</text>
    <text x="302" y="438" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#46636a">- Post doubt form and doubt detail page</text>
    <text x="302" y="460" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#46636a">- Subscription and payment UI</text>

    <rect x="280" y="490" width="370" height="110" rx="18" fill="#f6fafb" stroke="#d8e6e8" />
    <text x="302" y="518" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#13363c">Tutor and admin views</text>
    <text x="302" y="546" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#46636a">- Faculty queue with claim / submit actions</text>
    <text x="302" y="568" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#46636a">- Admin dashboard for users, tutors, subjects</text>
    <text x="302" y="590" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#46636a">- Profile page and role-based protected routes</text>

    <rect x="280" y="620" width="370" height="140" rx="18" fill="#f6fafb" stroke="#d8e6e8" />
    <text x="302" y="648" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#13363c">Supporting interfaces</text>
    <text x="302" y="676" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#46636a">- Public knowledge base search and subject filters</text>
    <text x="302" y="698" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#46636a">- Team home, add member, member list, member detail</text>
    <text x="302" y="720" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#46636a">- Axios service layer with JWT interceptor</text>
    <text x="302" y="742" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#46636a">- Auth context using localStorage persistence</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="740" y="150" width="430" height="640" rx="28" fill="#ffffff" stroke="#c3d4d7" stroke-width="2" />
    <rect x="740" y="150" width="430" height="72" rx="28" fill="url(#backendHeader)" />
    <rect x="740" y="194" width="430" height="28" fill="url(#backendHeader)" />
    <text x="955" y="194" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#ffffff">
