    <text x="850" y="860" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Email / OTP</text>
    <text x="850" y="898" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#534b9c">Nodemailer + Gmail SMTP</text>
    <text x="850" y="918" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#534b9c">Verification and reset mail</text>

    <rect x="965" y="835" width="180" height="98" rx="22" fill="#ffffff" stroke="#d2d0fb" stroke-width="2" />
    <rect x="965" y="835" width="180" height="40" rx="22" fill="url(#serviceHeader)" />
    <rect x="965" y="857" width="180" height="18" fill="url(#serviceHeader)" />
    <text x="1055" y="860" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Razorpay</text>
    <text x="1055" y="898" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#534b9c">Order creation and signature</text>
    <text x="1055" y="918" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#534b9c">Premium / Pro subscription flow</text>

    <rect x="1170" y="835" width="180" height="98" rx="22" fill="#ffffff" stroke="#d2d0fb" stroke-width="2" />
    <rect x="1170" y="835" width="180" height="40" rx="22" fill="url(#serviceHeader)" />
    <rect x="1170" y="857" width="180" height="18" fill="url(#serviceHeader)" />
    <text x="1260" y="860" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Uploads</text>
    <text x="1260" y="898" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#534b9c">Local member photos</text>
    <text x="1260" y="918" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#534b9c">Served from /uploads</text>
  </g>

  <path d="M 190 240 C 220 240, 220 240, 250 240" fill="none" stroke="#35565c" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M 190 420 C 220 420, 220 420, 250 420" fill="none" stroke="#35565c" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M 190 600 C 220 600, 220 600, 250 600" fill="none" stroke="#35565c" stroke-width="4" marker-end="url(#arrow)" />

