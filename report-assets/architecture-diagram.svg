  <text x="710" y="450" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#35565c">HTTPS / REST API</text>

  <path d="M 1170 390 C 1190 390, 1190 390, 1220 390" fill="none" stroke="#35565c" stroke-width="5" marker-end="url(#arrow)" />
  <text x="1194" y="368" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#35565c">Mongoose</text>

  <path d="M 955 790 C 955 815, 850 815, 850 835" fill="none" stroke="#35565c" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M 995 790 C 995 815, 1055 815, 1055 835" fill="none" stroke="#35565c" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M 1110 790 C 1110 815, 1260 815, 1260 835" fill="none" stroke="#35565c" stroke-width="4" marker-end="url(#arrow)" />

  <text x="800" y="975" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#56737a">
    Note: Automated tutor assignment and advanced analytics endpoints exist in the codebase, but the current user-facing flow still depends on manual tutor claiming and summary-style analytics screens.
  </text>
