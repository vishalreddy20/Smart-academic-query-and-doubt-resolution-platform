      MongoDB Atlas
    </text>
    <text x="1365" y="295" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#dbefff">
      Mongoose models and indexes
    </text>
    <text x="1248" y="340" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#29506f">Collections in active flow:</text>
    <text x="1248" y="372" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#40617b">- users</text>
    <text x="1248" y="398" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#40617b">- subjects</text>
    <text x="1248" y="424" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#40617b">- doubts</text>
    <text x="1248" y="450" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#40617b">- subscriptions</text>
    <text x="1248" y="476" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#40617b">- payments</text>
    <text x="1248" y="502" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#40617b">- members and otps</text>
  </g>

