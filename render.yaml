services:
  - type: web
    name: smart-academic-query-platform
    runtime: node
    rootDir: .
    buildCommand: npm install && npm --prefix backend install && npm run build
    startCommand: npm --prefix backend start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 5000